# `pre-commit install` writes the `pre-commit` hook type and nothing else unless
# this key says otherwise, so the pre-push work declared below runs on this
# machine only for as long as somebody remembers to have run
# `pre-commit install --hook-type pre-push` by hand. Declaring both types makes
# the gate a property of the repo rather than of one laptop (metaframework
# #725). `dispatch gates` reports the undeclared case as INERT or FRAGILE.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # The whole suite, on every commit and every push: no `stages:`, so it is
      # registered at both. It takes a few seconds. This repo has no CI, so
      # these hooks are the only place the tests run before a change merges.
      - id: pytest
        name: pytest
        # `--frozen` so a hook run cannot re-resolve and rewrite uv.lock.
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        # Without this, a change that touches no file pre-commit hands to the
        # hook (a push of only this YAML, say) would skip the suite.
        always_run: true
